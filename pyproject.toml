[project]
name = "olas-sdk-starter"
version = "0.1.0"
description = "Minimum configuration files for deploying an autonomous agent built with any framework on the Olas stack."
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dependencies = [
    "open-autonomy[all]==0.21.21",
]

[dependency-groups]
dev = [
    "tomte[tests,cli]==0.7.0",
]

[tool.uv]
package = false
prerelease = "allow"
