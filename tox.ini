; Local extensions to tomte's canonical tox.ini. Consumed by `tomte tox`.
;
; This file does NOT define testenvs — tomte ships the canonical set
; (bandit, safety, black, isort, flake8, mypy, pylint, darglint,
; check-hash, check-packages, check-dependencies, check-abciapp-specs,
; check-abci-docstrings, abci-docstrings, check-handlers, liccheck,
; gitleaks, ...). Per-repo overrides go below.

[tomte-extensions]
; extra_deps: starter ships only vendored OA/OAEA packages, so the
; canonical [deps-packages] is sufficient. Add lines here only if a
; future custom skill imports a lib tomte's canonical does not.

[pytest]
tomte_defaults = true

[mypy]
python_version = 3.10
; Excludes auto-generated protobuf and custom_types files. CI's lint
; scope (packages/valory pre-sync) doesn't contain any today, but the
; pattern is defensive: a contributor running mypy locally after
; `autonomy packages sync` would otherwise hit vendored protobuf code.
exclude = (.*_pb2|.*custom_types)

; No [mypy-<lib>] blocks intentionally. Tomte's canonical mypy.ini
; already ignores aea.*, pytest.*, web3.*, requests.*, numpy.*,
; pytz.*, click.*, autonomy.*, yaml.*, google.protobuf.*, etc. Add
; a block here ONLY if `tomte tox -e mypy` flags a real missing-import
; for code this repo owns.

[Authorized Packages]
open-autonomy: ==0.21.23
; Pulled transitively via open-aea-ledger-solana. They publish no
; SPDX license classifier on PyPI; license text confirms each is
; permissive (anchorpy Apache-2.0, based58 Apache-2.0, jsonalias MIT)
; but liccheck PARANOID requires explicit allow-listing. Mirrors
; trader's [Authorized Packages] entries.
anchorpy: 0.20.2
based58: 0.1.1
jsonalias: 0.1.1
; Starter shipped a 25-entry list of grandfathered transitive deps
; (gym, filelock, fetchai-ledger-api, paramiko, chardet, etc.). Most
; were pulled by libs (pytz, py-ecc, grpcio, web3<8) that the canonical
; [deps-packages] does not bring in. Re-add entries here only if
; `tomte tox -e liccheck` actually fails on them on a cold cache.
